<!DOCTYPE html>
<html>
<head>
    <title>Create Access Request</title>
</head>

<body>

    <h1>Create Access Request</h1>

    <form method="POST">

        <label>Employee Name:</label><br>
        <input type="text" name="employee_name" required>
        <br><br>

        <label>Employee ID:</label><br>
        <input type="text" name="employee_id" required>
        <br><br>

        <label>Application:</label><br>
        <input type="text" name="application" required>
        <br><br>

        <label>Access Requested:</label><br>
        <input type="text" name="access_requested" required>
        <br><br>

        <label>Business Reason:</label><br>
        <textarea name="business_reason" required></textarea>
        <br><br>

        <button type="submit">Submit Request</button>

    </form>

</body>
</html>
